; PlatformIO project for the Lightkeeper device skeleton (src/): build only so
; far, see README.md. It links the same libraries the host tests check
; (lib/glucose_rules, lib/nightscout_json, lib/panel_bitmap), never copies.
;
;   pio run                                  build both boards
;   pio run -e bench_s3 -t upload            flash the bench board
;   pio device monitor -e bench_s3           watch its serial dump
;
; PlatformIO does not run make, so lib/panel_bitmap/font5x8_data.h is
; committed (tools/gen_font_header.py writes it). The versions are pinned:
; platform espressif32 7.1.3, which brings Arduino-ESP32 2.0.17
; (framework-arduinoespressif32 ~4.20017.0) and the GCC 8.4.0 toolchains.
; .github/workflows/firmware-device.yml builds both environments with the
; same pins.

[platformio]
default_envs = bench_s3, x4
src_dir = src
lib_dir = lib

[env]
platform = espressif32 @ 7.1.3
framework = arduino
monitor_speed = 115200
; The framework defaults to gnu++11; the libraries are C++17. Serial is the
; native USB port on both boards (VERIFY on the bench).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-S3-ePaper-1.54: the firmware bench board (docs/HARDWARE.md).
; The DevKitC-1 board definition assumes 8 MB of quad I/O (qio) flash and the
; default_8MB.csv partition table. VERIFY on the bench before the first
; upload: the image header and the partition table are built for that size,
; so if the board differs set board_upload.flash_size here, with a matching
; board_build.partitions and board_build.flash_mode.
[env:bench_s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DLK_BOARD_BENCH_S3

; Xteink X4: the pocket display (ESP32-C3). The DevKitM board definition
; assumes 4 MB of quad I/O flash (VERIFY on the X4, as for bench_s3) and
; leaves out ARDUINO_USB_MODE, which Serial over the C3's USB port needs (the
; S3 definition sets it).
[env:x4]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DLK_BOARD_X4
