name: iOS

# Builds and tests the Swift package and the iOS app on GitHub's macOS
# runners, so the project needs no Mac. Runs only when iOS code or the shared
# vectors change. (Public repository: macOS minutes are free.)

on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "spec/display_vectors.json", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", "spec/display_vectors.json", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  core-tests:
    name: LightkeeperCore tests (shared vectors)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Run package tests
        working-directory: apps/ios/LightkeeperCore
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || status=$?
          # Surface compiler and test failures as annotations, which are readable
          # through the API even where raw logs are not.
          grep -E "(error:|failed|XCTAssert)" test.log | head -40 | sed 's/^/::error::/' || true
          exit ${status:-0}

  app-build:
    name: Build the app for the simulator
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: apps/ios/Lightkeeper
        run: xcodegen generate
      - name: Build (no signing, simulator)
        working-directory: apps/ios/Lightkeeper
        run: |
          set -o pipefail
          xcodebuild -project Lightkeeper.xcodeproj -scheme Lightkeeper \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -40 || status=$?
          grep -E "error:" build.log | head -40 | sed 's/^/::error::/' || true
          exit ${status:-0}
