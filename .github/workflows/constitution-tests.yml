name: Constitution Test Runner

# Runs the test command this repository declares in docs/TEST_PLAN.md's
# "How to Run Tests" section (the "Full suite" line), via the constitution's
# scripts/run_declared_tests.sh, which ships in the pinned `constitution/`
# submodule.
#
# The constitution is language/stack-agnostic, so it cannot know how to set up
# your runtime. Add your own setup step (actions/setup-node, actions/setup-python,
# actions/setup-go, etc.) BEFORE the "Run declared test command" step below,
# and install dependencies there too.
#
# Runs in default (non-strict) mode: if docs/TEST_PLAN.md has not been filled
# in yet, this warns instead of failing, so adopting this template doesn't
# immediately break CI. Once your "Full suite" command is real, add --strict
# to the run_declared_tests.sh invocation below to also fail when nothing is
# declared — a declared command that fails is ALWAYS enforced regardless of
# --strict.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Confirm constitution submodule is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e constitution/scripts/run_declared_tests.sh ]; then
            echo "::error::No 'constitution/' submodule found (or it is too old to ship the test runner). This repository does not appear to adopt Eric's Engineering Constitution."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # tests/test_demo_panel.py runs web/panel/panel.test.mjs, and fails
      # rather than skips when CI is set and node is missing.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install package and test dependencies
        shell: bash
        run: python -m pip install -e ".[dev]"

      # Three tests open a real Tk window: two in tests/test_tk_window.py (the
      # window holds exactly the panel pixels; a wake from another thread gets
      # through) and one in tests/test_desktop.py (the ticker alone keeps the
      # window polling). docs/SAFETY.md cites them for HAZ-016 and HAZ-002
      # (the window freezes silently). They skip locally with no display and
      # fail on CI with none, so the suite runs under xvfb-run. The runner image
      # ships Xvfb and Tk; this installs them only when it does not, and then
      # opens one window, so a missing display or Tk fails here, by name.
      - name: Make sure a virtual display is available
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          { command -v xvfb-run && command -v xauth; } >/dev/null || missing="xvfb xauth"
          python -c "import tkinter" 2>/dev/null || missing="$missing libtk8.6"
          if [ -n "$missing" ]; then
            sudo apt-get update
            # shellcheck disable=SC2086 # a space-separated list of package names
            sudo apt-get install -y --no-install-recommends $missing
          fi
          xvfb-run -a --server-args='-screen 0 1280x1024x24' \
            python -c "import tkinter; tkinter.Tk().destroy(); print('Tk', tkinter.TkVersion, 'opened a window')"

      - name: Run declared test command
        shell: bash
        run: xvfb-run -a --server-args='-screen 0 1280x1024x24' bash constitution/scripts/run_declared_tests.sh --strict .
