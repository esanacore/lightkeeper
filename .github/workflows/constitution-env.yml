name: Constitution - Environment Contract

# Confirms every environment variable declared in a configuration manifest
# has an entry in docs/ENV_VARS.md (constitution/scripts/check_env_vars.sh).

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  check-env:
    name: Documented Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check Environment Contract
        shell: bash
        run: bash constitution/scripts/check_env_vars.sh --strict .
