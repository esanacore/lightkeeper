<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Lightkeeper mark">
  <title>Lightkeeper mark</title>
  <!-- A single point of light and the sweep it casts: three concentric arcs
       inside a 60 degree sector (lens, beam, reach). The keeper's tower is
       reduced to the stem that holds the light. -->
  <defs>
    <clipPath id="lk-sector"><path d="M96 120 L256 27.6 L256 212.4 Z"/></clipPath>
  </defs>
  <g clip-path="url(#lk-sector)">
    <circle cx="96" cy="120" r="152" fill="#E0A526" opacity="0.16"/>
    <circle cx="96" cy="120" r="108" fill="#E0A526" opacity="0.42"/>
    <circle cx="96" cy="120" r="66" fill="#E0A526"/>
  </g>
  <rect x="88" y="120" width="16" height="104" rx="3" fill="#15171C"/>
  <rect x="60" y="222" width="72" height="10" rx="3" fill="#15171C"/>
  <circle cx="96" cy="120" r="24" fill="#15171C"/>
  <circle cx="96" cy="120" r="11" fill="#E0A526"/>
</svg>
