[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "glucose-watch"
version = "0.1.0"
description = "Read-only Nightscout glucose display for secondary screens (not a medical device)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
glucose-watch = "glucose_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["glucose_watch"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
