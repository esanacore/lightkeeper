[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lightkeeper"
version = "0.2.0"
description = "Read-only Nightscout glucose display for secondary screens (not a medical device)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "setuptools>=69",
]

[project.scripts]
lightkeeper = "lightkeeper.cli:main"

# The desktop window, with no console window on Windows (D12, pending Eric's review).
[project.gui-scripts]
lightkeeper-window = "lightkeeper.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -rs"

[tool.coverage.run]
source = ["lightkeeper"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["constitution"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, docstrings (PEP 257), bugbear, pyupgrade, bandit
select = ["E", "W", "F", "I", "D", "B", "UP", "S"]
ignore = [
    "D203",  # one-blank-line-before-class: conflicts with D211
    "D213",  # multi-line-summary-second-line: conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design and describe behavior through test names.
"tests/**" = ["S101", "S105", "S106", "S314", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
"tools/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
