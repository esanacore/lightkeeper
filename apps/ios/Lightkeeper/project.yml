# XcodeGen spec for the Lightkeeper iOS app. CI (and anyone with a Mac) runs
# `xcodegen generate` to produce Lightkeeper.xcodeproj; the project file is
# not committed, so the source of truth stays reviewable text.
name: Lightkeeper
options:
  bundleIdPrefix: com.esanacore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  LightkeeperCore:
    path: ../LightkeeperCore
targets:
  Lightkeeper:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: LightkeeperCore
    scheme:
      testTargets: [LightkeeperTests]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Lightkeeper
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.esanacore.lightkeeper
        # Sources/Assets.xcassets: the brand app icon (one 1024 px image) and
        # the accent color (Beam text, so tinted control text stays legible).
        # tests/test_ios_palette.py holds both to assets/brand.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LightkeeperTests:
    # Unit tests for the app layer (settings persistence, foreground
    # re-classification). The display rules themselves are tested in the
    # LightkeeperCore package against the shared vectors.
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Lightkeeper
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.esanacore.lightkeeper.tests
